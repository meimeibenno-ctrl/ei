<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡圍巾專賣 - Minimal Scarf Shop</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        milk: {
                            50: '#FDFBF7',
                            100: '#F7F2EC',
                            200: '#E8DED2',
                            300: '#D6C7B7',
                        },
                        camel: {
                            500: '#B88652',
                            600: '#A06E3B',
                            700: '#7E5227',
                        },
                        earth: {
                            600: '#8A7363',
                            700: '#6D594B',
                            800: '#4A3B32',
                            900: '#2D231D',
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FDFBF7;
            color: #2D231D;
            user-select: none;
        }

        /* Cart Icon Bounce Effect */
        @keyframes cartPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.35) rotate(-12deg); }
            70% { transform: scale(1.1) rotate(8deg); }
            100% { transform: scale(1); }
        }
        .animate-cart-pop {
            animation: cartPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Custom Bear Head Shaped Add-To-Cart Button */
        .bear-button {
            position: relative;
            background-color: #A06E3B;
            color: #FFFFFF;
            border-radius: 20px 20px 18px 18px;
            padding: 8px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.25s ease;
            box-shadow: 0 3px 8px rgba(160, 110, 59, 0.25);
            margin-top: 8px;
        }

        /* Left and Right Bear Ears */
        .bear-button::before,
        .bear-button::after {
            content: '';
            position: absolute;
            top: -6px;
            width: 14px;
            height: 14px;
            background-color: #A06E3B;
            border-radius: 50%;
            transition: all 0.25s ease;
            z-index: -1;
        }
        .bear-button::before { left: 12px; }
        .bear-button::after { right: 12px; }

        /* Hover & Active Effects for Bear Button */
        .bear-button:hover {
            background-color: #7E5227;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(126, 82, 39, 0.35);
        }
        .bear-button:hover::before,
        .bear-button:hover::after {
            background-color: #7E5227;
            transform: scale(1.15);
        }
        .bear-button:active {
            transform: scale(0.96) translateY(0);
        }

        /* Flying Bear Element */
        .flying-bear-wrapper {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            will-change: transform;
        }

        /* Flying Bear Head Shape */
        .bear-head-shape {
            position: relative;
            background: #A06E3B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(126, 82, 39, 0.4);
        }

        .bear-head-shape::before,
        .bear-head-shape::after {
            content: '';
            position: absolute;
            top: -4px;
            width: 13px;
            height: 13px;
            background: #A06E3B;
            border-radius: 50%;
            z-index: -1;
        }
        .bear-head-shape::before { left: -1px; }
        .bear-head-shape::after { right: -1px; }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #D6C7B7;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <header class="sticky top-0 z-40 bg-milk-50/90 backdrop-blur-md border-b border-milk-200">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#" class="font-serif text-xl font-bold tracking-tight text-earth-900 flex items-center gap-2">
                <span>SCARF</span>
                <span class="text-xs tracking-widest font-sans font-normal text-camel-600 border-l border-milk-300 pl-2">織語</span>
            </a>

            <!-- Cart Trigger Button -->
            <button id="cart-btn" onclick="toggleCart()" class="relative p-2 bg-milk-100 rounded-full border border-milk-200 flex items-center gap-2.5 px-4 hover:bg-milk-200 active:scale-95 transition-all">
                <div class="relative">
                    <i class="fa-solid fa-bag-shopping text-camel-600 text-base"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2.5 bg-camel-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold shadow-sm">0</span>
                </div>
                <span id="cart-header-total" class="text-xs font-bold text-earth-900 ml-1">NT$ 0</span>
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full flex items-center justify-center">
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 w-full">
            <!-- 4 Scarf Products injected dynamically -->
        </div>
    </main>

    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-earth-900/30 opacity-0 pointer-events-none transition-opacity duration-300 z-50 backdrop-blur-xs"></div>
    <aside id="cart-sidebar" class="fixed top-0 right-0 h-full w-80 max-w-full bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 bg-milk-100 border-b border-milk-200 flex justify-between items-center">
            <div class="flex items-center gap-2 text-earth-900">
                <i class="fa-solid fa-bag-shopping text-camel-600"></i>
                <h3 class="font-bold text-sm">購物車</h3>
            </div>
            <button onclick="toggleCart()" class="text-earth-700 hover:text-earth-900 p-1">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar">
            <!-- Dynamic Cart Content -->
        </div>

        <div class="p-4 bg-milk-50 border-t border-milk-200 space-y-3">
            <div class="flex justify-between font-bold text-sm text-earth-900">
                <span>總計金額</span>
                <span id="cart-total" class="text-camel-600">NT$ 0</span>
            </div>

            <button onclick="checkout()" class="w-full py-3 bg-camel-600 text-white rounded-full font-bold text-xs hover:bg-camel-700 active:scale-98 transition-all shadow-md">
                前往結帳
            </button>
        </div>
    </aside>

    <!-- Modal for Order Confirmation -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-earth-900/40 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center space-y-4 shadow-2xl border border-milk-200">
            <div class="text-4xl">🧸🧣</div>
            <h3 class="font-bold text-base text-earth-900">感謝您的購買！</h3>
            <p class="text-xs text-earth-700">泰迪熊將盡快為您配送溫暖圍巾。</p>
            <button onclick="closeModal()" class="w-full py-2.5 bg-camel-600 text-white rounded-full text-xs font-bold hover:bg-camel-700 transition-colors">
                完成
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-milk-100 border-t border-milk-200 py-4 text-center text-[11px] text-earth-700">
        <p>&copy; 2026 織語 SCARF. 極簡質感生活</p>
    </footer>

    <script>
        // High Quality Verified Scarf Images
        const products = [
            { 
                id: '1', 
                name: '經典喀什米爾圍巾', 
                price: 1280, 
                img: 'https://images.unsplash.com/photo-1520903920243-00d872a2d1c9?q=80&w=500&auto=format&fit=crop' 
            },
            { 
                id: '2', 
                name: '羊駝毛厚織圍巾', 
                price: 1580, 
                img: 'https://images.unsplash.com/photo-1608256246200-53e635b5b65f?q=80&w=500&auto=format&fit=crop' 
            },
            { 
                id: '3', 
                name: '法式格紋圍巾', 
                price: 980, 
                img: 'https://images.unsplash.com/photo-1584030373081-f37b7bb4fa8e?q=80&w=500&auto=format&fit=crop' 
            },
            { 
                id: '4', 
                name: '莫蘭迪暖色圍巾', 
                price: 1180, 
                img: 'https://images.unsplash.com/photo-1516762689617-e1cffffd478d?q=80&w=500&auto=format&fit=crop' 
            }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl overflow-hidden border border-milk-200 p-3 flex flex-col justify-between shadow-xs hover:shadow-md transition-shadow">
                        <div onclick="triggerAddAnimation('${p.id}', event)" class="aspect-square bg-milk-100 rounded-xl overflow-hidden mb-3 cursor-pointer group relative">
                            <img src="${p.img}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1520903920243-00d872a2d1c9?q=80&w=500&auto=format&fit=crop'">
                        </div>
                        <div class="space-y-1.5 text-center flex flex-col items-center">
                            <div class="text-xs font-medium text-earth-800 truncate w-full">${p.name}</div>
                            <div class="font-bold text-sm text-earth-900">NT$ ${p.price.toLocaleString()}</div>
                            
                            <!-- Teddy Bear Head Shaped Button -->
                            <button onclick="triggerAddAnimation('${p.id}', event)" class="bear-button w-full">
                                <span class="text-xs">🧸</span>
                                <span>加入購物車</span>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // Parabolic Flying Teddy Bear Animation
        function triggerAddAnimation(productId, event) {
            const item = products.find(p => p.id === productId);
            if (!item) return;

            const triggerElem = event.currentTarget;
            const startRect = triggerElem.getBoundingClientRect();
            const cartBtn = document.getElementById('cart-btn');
            const targetRect = cartBtn.getBoundingClientRect();

            // Create Bear Shape Element
            const flyer = document.createElement('div');
            flyer.className = 'flying-bear-wrapper';
            flyer.innerHTML = `
                <div class="bear-head-shape w-9 h-9">
                    <div class="relative flex items-center justify-center">
                        <span class="text-sm">🧸</span>
                        <span class="absolute -bottom-1 -right-1 text-xs">🧣</span>
                    </div>
                </div>
            `;
            document.body.appendChild(flyer);

            const startX = startRect.left + startRect.width / 2;
            const startY = startRect.top + startRect.height / 2;
            const endX = targetRect.left + targetRect.width / 2;
            const endY = targetRect.top + targetRect.height / 2;

            const startTime = performance.now();
            const duration = 600; // ms
            const peakY = Math.min(startY, endY) - 110;

            function animateArc(now) {
                const elapsed = now - startTime;
                const t = Math.min(elapsed / duration, 1);

                // Quadratic Bezier Arc Path Formula
                const curX = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * ((startX + endX) / 2) + t * t * endX;
                const curY = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * peakY + t * t * endY;
                const scale = 1 - t * 0.3;
                const rotate = Math.sin(t * Math.PI * 2) * 25;

                flyer.style.transform = `translate3d(${curX - 18}px, ${curY - 18}px, 0) scale(${scale}) rotate(${rotate}deg)`;

                if (t < 1) {
                    requestAnimationFrame(animateArc);
                } else {
                    flyer.remove();
                    addToCartData(item);
                    
                    // Cart Icon Bump Animation
                    cartBtn.classList.remove('animate-cart-pop');
                    void cartBtn.offsetWidth;
                    cartBtn.classList.add('animate-cart-pop');
                }
            }

            requestAnimationFrame(animateArc);
        }

        function addToCartData(product) {
            const existing = cart.find(i => i.id === product.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCartUI();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            renderCartUI();
        }

        function renderCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('cart-count').textContent = totalCount;
            document.getElementById('cart-header-total').textContent = `NT$ ${totalPrice.toLocaleString()}`;
            document.getElementById('cart-total').textContent = `NT$ ${totalPrice.toLocaleString()}`;

            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-earth-700/60 text-xs flex flex-col items-center gap-2">
                        <span class="text-3xl opacity-50">🧸</span>
                        <span>購物車內尚無商品</span>
                    </div>
                `;
            } else {
                container.innerHTML = '';
                cart.forEach(i => {
                    container.innerHTML += `
                        <div class="flex items-center gap-3 bg-milk-50 p-2.5 rounded-xl border border-milk-200">
                            <img src="${i.img}" class="w-12 h-12 rounded-lg object-cover flex-shrink-0">
                            <div class="flex-grow min-w-0">
                                <div class="text-xs font-bold text-earth-900 truncate">${i.name}</div>
                                <div class="text-xs text-camel-600 font-medium">NT$ ${i.price.toLocaleString()}</div>
                            </div>
                            <div class="flex items-center gap-1.5 border border-milk-200 rounded-lg bg-white px-1.5 py-0.5 flex-shrink-0">
                                <button onclick="changeQty('${i.id}', -1)" class="w-5 h-5 text-earth-800 text-xs flex items-center justify-center font-bold hover:bg-milk-100 rounded">-</button>
                                <span class="text-xs font-bold text-earth-900 px-1">${i.qty}</span>
                                <button onclick="changeQty('${i.id}', 1)" class="w-5 h-5 text-earth-800 text-xs flex items-center justify-center font-bold hover:bg-milk-100 rounded">+</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        function toggleCart() {
            const side = document.getElementById('cart-sidebar');
            const over = document.getElementById('cart-overlay');
            const isOpen = !side.classList.contains('translate-x-full');

            side.classList.toggle('translate-x-full', isOpen);
            over.classList.toggle('opacity-0', isOpen);
            over.classList.toggle('pointer-events-none', isOpen);
        }

        function checkout() {
            if (cart.length === 0) return;
            cart = [];
            renderCartUI();
            toggleCart();
            const modal = document.getElementById('modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        window.onload = () => {
            renderProducts();
            renderCartUI();
        };
    </script>
</body>
</html>
